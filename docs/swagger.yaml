info:
  contact:
    email: matheuseufrasio2@gmail.com
    name: Matheus
  description: "High-performance RESTful API for barbershop scheduling and operations
    management.\n\n### \U0001F511 Credenciais de Teste (Dev Seed - Senha para todas:
    `admin123`)\n\n| Role | Email | Organização / Unidade |\n| :--- | :--- | :---
    |\n| `SUPER_ADMIN` | `superadmin@pontocerto.com.br` | Acesso global multi-rede
    |\n| `ORG_OWNER` | `owner@pontocerto.com.br` | Org 1 - Rede Ponto Certo |\n| `UNIT_MANAGER`
    | `manager.matriz@pontocerto.com.br` | Org 1 - Matriz Centro |\n| `RECEPTIONIST`
    | `recepcao.matriz@pontocerto.com.br` | Org 1 - Matriz Centro |\n| `BARBER` |
    `marcos.barbeiro@pontocerto.com.br` | Org 1 - Matriz Centro |\n| `ORG_OWNER` |
    `owner.corleone@pontocerto.com.br` | Org 2 - Don Corleone |\n| `UNIT_MANAGER`
    | `manager.jardins@pontocerto.com.br` | Org 2 - Jardins |\n| `RECEPTIONIST` |
    `recepcao.jardins@pontocerto.com.br` | Org 2 - Jardins |\n| `BARBER` | `barbeiro.jardins@pontocerto.com.br`
    | Org 2 - Jardins |\n\n**Como autenticar no Swagger:** Faça login em `POST /api/v1/auth/login`,
    copie o token do JSON, clique no botão **Authorize** (topo direito) e cole: `Bearer
    <token>`."
  title: Ponto Certo API
  version: "1.0"
paths:
  /admin/metrics:
    get:
      description: Returns platform-wide MRR, ARR, active tenants, churn rate, and
        total units
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.SaaSMetrics'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get SaaS platform KPIs
      tags:
      - admin
  /admin/tenants:
    get:
      description: Returns paginated organizations matching search term, status, and
        plan filters
      parameters:
      - description: Search by name, trade name or document
        in: query
        name: search
        type: string
      - description: Filter by subscription status (ACTIVE, PAST_DUE, TRIAL, CANCELLED)
          or BLOCKED
        in: query
        name: status
        type: string
      - description: Filter by plan (BASIC, PRO, ENTERPRISE)
        in: query
        name: plan
        type: string
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 15)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.PaginatedOrganizations'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List and search organizations
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Creates organization, headquarters branch and owner user in a transaction
      parameters:
      - description: Tenant creation payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.CreateTenantInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.Organization'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Onboard a new barbershop franchise tenant
      tags:
      - admin
  /admin/tenants/{id}/overview:
    get:
      description: Returns 30-day GMV, 30-day appointment volume, total barbers, and
        overdue status
      parameters:
      - description: Organization UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.TenantOverview'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get aggregated engagement and financial metrics for a tenant
      tags:
      - admin
  /admin/tenants/{id}/plan:
    patch:
      consumes:
      - application/json
      description: Updates organization plan tier (BASIC, PRO, ENTERPRISE) and monthly
        fee
      parameters:
      - description: Organization UUID
        in: path
        name: id
        required: true
        type: string
      - description: Plan update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.UpdateTenantPlanInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.Organization'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upgrade or downgrade a tenant's subscription plan and fee
      tags:
      - admin
  /admin/tenants/{id}/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a specified password or generates a temporary credential for
        tenant owner
      parameters:
      - description: Organization UUID
        in: path
        name: id
        required: true
        type: string
      - description: Optional custom password payload
        in: body
        name: body
        schema:
          $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.ResetTenantPasswordInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.ResetPasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Administratively reset franchise owner's password
      tags:
      - admin
  /admin/tenants/{id}/toggle-status:
    patch:
