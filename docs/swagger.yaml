basePath: /api/v1
definitions:
  github_com_matheuseufrasio2_ponto_certo_internal_domain.Role:
    enum:
    - SUPER_ADMIN
    - ORG_OWNER
    - UNIT_MANAGER
    - RECEPTIONIST
    - BARBER
    type: string
    x-enum-varnames:
    - RoleSuperAdmin
    - RoleOrgOwner
    - RoleUnitManager
    - RoleReceptionist
    - RoleBarber
  github_com_matheuseufrasio2_ponto_certo_internal_service.LoginInput:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  github_com_matheuseufrasio2_ponto_certo_internal_service.LoginOutput:
    properties:
      expires_in:
        description: in seconds
        type: integer
      token:
        type: string
      token_type:
        description: always Bearer
        type: string
      user:
        $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_service.UserResponse'
    type: object
  github_com_matheuseufrasio2_ponto_certo_internal_service.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      organization_id:
        type: string
      role:
        $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_domain.Role'
      unit_id:
        type: string
    type: object
  internal_handler.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  internal_handler.HealthResponse:
    properties:
      message:
        type: string
      status:
        type: string
    type: object
info:
  contact:
    email: matheuseufrasio2@gmail.com
    name: Matheus
  description: High-performance RESTful API for barbershop scheduling and operations
    management.
  title: Ponto Certo API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Autentica um usuário via e-mail e senha, retornando um JWT com
        seu papel e escopo de tenant.
      parameters:
      - description: Credenciais de acesso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_service.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: Token de acesso e dados do usuário
          schema:
            $ref: '#/definitions/github_com_matheuseufrasio2_ponto_certo_internal_service.LoginOutput'
        "400":
          description: Requisição malformada ou inválida
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "401":
          description: Credenciais incorretas
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "403":
          description: Usuário desativado
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Erro interno do servidor
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Realizar autenticação
      tags:
      - Auth
  /health:
    get:
      description: HealthCheck is a handler function that checks the health of the
        service and returns a JSON response indicating the status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.HealthResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Health check endpoint
      tags:
      - health
swagger: "2.0"
