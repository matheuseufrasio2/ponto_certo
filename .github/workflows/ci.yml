name: CI Go

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify go.mod and go.sum integrity
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "⚠️ Run 'go mod tidy' locally and commit the changes!" && exit 1)

      - name: Run Linter (golangci-lint)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          install-mode: goinstall
          args: --timeout=5m

      - name: Run tests with Race Detector
        run: go test -v -race ./...

      - name: Validate API build
        run: go build -v -o /dev/null ./cmd/api
