services:
  postgres:
    image: postgres:16-alpine
    container_name: ponto_certo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ponto_certo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ponto_certo"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.0
    profiles: ["tools"]
    volumes:
      - ./migrations:/migrations
    entrypoint: ["migrate", "-path=/migrations", "-database=postgres://postgres:postgres@postgres:5432/ponto_certo?sslmode=disable"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
